name: Docs

on:
  push:
    branches: [main]
    paths:
      - site/**
      - skills/**
      - examples/**
      - CHANGELOG.md
      - ROADMAP.md
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - site/**
      - skills/**
      - examples/**
      - CHANGELOG.md
      - ROADMAP.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          path: site
          node-version: 24

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
