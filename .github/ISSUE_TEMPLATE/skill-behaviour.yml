name: Skill behaved unexpectedly
description: A skill produced the wrong artefact, skipped a step, or passed a gate that it should have blocked.
labels: [skill-behaviour]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: spec-design-review
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the skill did and what you expected it to do.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent
      placeholder: Claude Code 2.x
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: claude-sonnet-5
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Install route
      options:
        - Claude Code plugin
        - npx skills add
        - Manual copy
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "Plugin: the Version line from `claude plugin list`. npx skills add: the date you installed or last updated. Manual copy: the output of `git -C sdd-skills rev-parse --short HEAD`."
    validations:
      required: true
  - type: textarea
    id: artefact
    attributes:
      label: Artefact
      description: Attach or paste the artefact the skill wrote, such as design-review-summary.md. Remove anything private first.
    validations:
      required: true
